{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tech Society{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- AOS CSS for Scroll Animations -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
    <!-- Meta Tags for SEO -->
    <meta name="description" content="Tech Society - A community of tech enthusiasts.">
    <meta name="keywords" content="Tech, Community, Development, Web, Programming, Coding">
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><img src="{% static 'images/SEC.png' %}" class="img-fluid" alt="logo"></a>
                <!-- Navbar Toggler Button -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'home' %}">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#communities">Communities</a>
                        </li>
                        <li class="nav-item"></li>
                            <a class="nav-link" href="#contact">Contact</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'register_member' %}">Register</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">
        {% block content %}
        <!-- Content will be injected here from child templates -->
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 Tech Society - Saveetha Engineering College. All Rights Reserved.</p>
        </div>
    </footer>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
    AOS.init();
    </script>

    <script>
        document.querySelector('.navbar-toggler').addEventListener('click', function () {
            const nav = document.querySelector('.navbar-nav');
            nav.classList.toggle('active');
        });
        window.addEventListener('scroll', () => {
            document.querySelectorAll('.column').forEach((el) => {
                const rect = el.getBoundingClientRect();
                if (rect.top < window.innerHeight) {
                    el.classList.add('visible');
                }
            });
        });
        document.addEventListener('DOMContentLoaded', function () {
            const typedText = document.getElementById('typed-text');
            const cursor = document.querySelector('.cursor');
            const textArray = ["Welcome to Tech Society!", "Join the Innovation!"];
            const typingDelay = 80;
            const erasingDelay = 80;
            const newTextDelay = 1000;
            let textArrayIndex = 0;
            let charIndex = 0;
        
            function type() {
                if (charIndex < textArray[textArrayIndex].length) {
                    if (!cursor.classList.contains("typing")) cursor.classList.add("typing");
                    typedText.textContent += textArray[textArrayIndex].charAt(charIndex);
                    charIndex++;
                    setTimeout(type, typingDelay);
                } else {
                    cursor.classList.remove("typing");
                    setTimeout(erase, newTextDelay);
                }
            }
        
            function erase() {
                if (charIndex > 0) {
                    if (!cursor.classList.contains("typing")) cursor.classList.add("typing");
                    typedText.textContent = textArray[textArrayIndex].substring(0, charIndex - 1);
                    charIndex--;
                    setTimeout(erase, erasingDelay);
                } else {
                    cursor.classList.remove("typing");
                    textArrayIndex++;
                    if (textArrayIndex >= textArray.length) textArrayIndex = 0;
                    setTimeout(type, typingDelay + 1100);
                }
            }
        
            if (textArray.length) setTimeout(type, newTextDelay + 250);
        });
        
    </script>
</body>
</html>
